<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>货代知识库</title><link rel="stylesheet" href="/src/style.css"><link rel="stylesheet" href="/src/crm.css"><link rel="stylesheet" href="/src/knowledge.css"></head><body>
<header><div class="brand">K<span>货代知识库</span></div><nav><a href="/">供应商管理</a> <a href="/crm.html">客户资源</a></nav></header><main>
<section id="login-panel" class="panel"><h2>登录货代知识库</h2><form id="login-form"><label>邮箱<input id="login-email" type="email" required autocomplete="username"></label><label>密码<input id="login-password" type="password" required autocomplete="current-password"></label><p id="login-error" role="alert"></p><button type="submit">登录</button></form></section>
<p><span id="account"></span> <button id="logout" hidden>退出登录</button></p><div id="workspace" hidden>
<section class="heading"><div><p class="eyebrow">航线与操作经验</p><h1>货代知识库</h1><p>把报价、单证和操作细节放回对应航线，保留来源和历史版本。</p></div><div class="actions"><button id="refresh" class="secondary">刷新</button><button id="add-route" disabled class="secondary">新增航线</button><button id="add-entry" disabled>新增知识 / 上传资料</button></div></section>
<p id="notice" role="status" aria-live="polite"></p><section class="stats"><article>知识条目<strong id="total">0</strong></article><article>待确认 / 冲突<strong id="pending">0</strong></article><article>已过期<strong id="expired">0</strong></article></section>
<section class="panel"><div class="toolbar"><label>搜索<input id="search" type="search" placeholder="操作内容、报价、口岸、供应商"></label><label>航线<select id="route-filter"><option value="">全部航线</option></select></label><label>确认状态<select id="status-filter"><option value="">全部状态</option><option>待确认</option><option>已核实</option><option>已过期</option><option>存在冲突</option></select></label><span id="count"></span></div>
<div class="table-wrap"><table><thead><tr><th>标题 / 类型</th><th>航线 / 供应商</th><th>来源 / 有效期</th><th>确认状态</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div><p id="empty">暂无资料，先创建条目并上传原始文件。</p><div class="pager"><button id="prev" class="secondary">上一页</button><span id="page"></span><button id="next" class="secondary">下一页</button></div></section>
<p class="footnote">原件私有保存。当前支持手工整理；PDF、Excel及图片尚不自动解析。报价超过有效期后会显示为已过期。</p></div></main>
<dialog id="entry-editor" class="detail-dialog"><form id="entry-form"><div class="dialog-heading"><h2 id="editor-title">新增知识</h2><button type="button" data-close="entry-editor" class="secondary">关闭</button></div><div class="fields">
<label class="wide">标题<input name="title" required maxlength="240"></label><label>航线<select name="route_id" id="entry-route" required></select></label><label>关联供应商<select name="supplier_id" id="entry-supplier"><option value="">不关联</option></select></label>
<label>类型<select name="kind"><option>航线档案</option><option>操作SOP</option><option>报价</option><option>单证要求</option><option>异常案例</option><option>其他</option></select></label><label>确认状态<select name="status"><option>待确认</option><option>已核实</option><option>已过期</option><option>存在冲突</option></select></label>
<label class="wide">适用范围<input name="scope" maxlength="2000" placeholder="起讫地、货类、箱型、口岸与例外条件"></label><label class="wide">内容 / 操作步骤<textarea name="content" rows="10" maxlength="50000" placeholder="报价请注明币种、计费单位、含费/不含费；操作按步骤列出责任人、单证、时间节点和异常处理。"></textarea></label>
<label class="wide">来源 / 核实依据<textarea name="source" maxlength="5000" rows="2" placeholder="文件名及页码、邮件日期、供应商确认记录"></textarea></label><label>来源日期<input name="source_date" type="date"></label><label>有效期至<input name="valid_until" type="date"></label></div><p id="entry-error" role="alert"></p><footer><button type="submit">保存并管理附件</button></footer></form></dialog>
<dialog id="detail" class="detail-dialog"><div class="dialog-heading"><h2 id="detail-title"></h2><button type="button" data-close="detail" class="secondary">关闭</button></div><p id="detail-meta"></p><button id="edit-entry">编辑知识</button><h3>适用范围</h3><p id="detail-scope" class="pre"></p><h3>内容 / 操作步骤</h3><div id="detail-content" class="pre"></div><h3>来源与核实依据</h3><p id="detail-source" class="pre"></p>
<h3>原始附件</h3><form id="upload-form"><label>选择原件（单个不超过20MB）<input id="upload-file" type="file" required accept=".pdf,.doc,.docx,.xls,.xlsx,.csv,.txt,.md,.png,.jpg,.jpeg,.webp,.eml"></label><button type="submit">上传原件</button><p id="upload-error" role="status"></p></form><div id="documents"></div><h3>历史版本</h3><div id="versions"></div></dialog>
<dialog id="route-editor"><form id="route-form"><div class="dialog-heading"><h2>新增航线</h2><button type="button" data-close="route-editor" class="secondary">关闭</button></div><div class="fields"><label>编号<input name="code" required maxlength="80" placeholder="例如 XI-HAM"></label><label>航线名称<input name="name" required maxlength="240"></label><label>运输方式<input name="category" required maxlength="80"></label><label>起运地<input name="origin" maxlength="240"></label><label>目的地<input name="destination" maxlength="240"></label><label class="wide">途经节点<input name="nodes" maxlength="2000"></label><label class="wide">备注<textarea name="notes" maxlength="5000"></textarea></label></div><p id="route-error" role="alert"></p><footer><button type="submit">保存航线</button></footer></form></dialog>
<script type="module" src="/src/knowledge.js"></script></body></html>
