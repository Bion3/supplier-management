<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>业务助手 · Eurasiago</title><link rel="stylesheet" href="/src/style.css"><link rel="stylesheet" href="/src/assistant.css"></head><body><header></header><main class="assistant-main"><div class="assistant-heading"><div><p class="eyebrow">EURASIAGO · 业务助手</p><h1>查资料，少点几步</h1><p>选择常用操作，或输入简单问题。</p></div><span class="assistant-badge">基础版 · 无模型调用费</span></div><section class="assistant-shortcuts" aria-label="常用操作"><button type="button" data-prompt="查德国有邮箱的待开发客户"><b>找客户</b><span>地区 · 邮箱 · 开发状态</span></button><button type="button" data-prompt="今天任务进度"><b>查任务</b><span>采集 · 补全 · 异常</span></button><button type="button" data-prompt="检查报价费用"><b>查报价</b><span>成本组合 · 缺失费用</span></button><button type="button" data-prompt="写开发邮件"><b>写邮件</b><span>固定模板 · 编辑复制</span></button></section><form id="assistant-form" class="assistant-question"><label for="assistant-input">简单描述你要做什么</label><div><input id="assistant-input" maxlength="500" placeholder="例如：查波兰 ENF 有邮箱的待开发客户" required><button id="assistant-send" type="submit">查询</button></div></form><p id="assistant-notice" role="status"></p><section id="assistant-result" class="assistant-panel" aria-live="polite"><h2>从上方选择操作</h2><p>支持常用关键词和固定流程。客户、任务数据按当前账号权限读取。</p></section><section id="assistant-draft" class="assistant-panel" hidden><div class="assistant-panel-title"><h2>邮件草稿</h2><a href="/mail.html">前往开发邮件 →</a></div><p>选择模板并补充信息，生成后可编辑、复制。</p><div class="assistant-fields"><label>模板<select id="draft-type"><option value="intro">初次开发</option><option value="followup">需求跟进</option><option value="inquiry">向供应商询价</option></select></label><label>语言<select id="draft-language"><option value="en">English</option><option value="zh">中文</option></select></label><label>收件公司<input id="draft-company" maxlength="150" placeholder="选填"></label><label>业务线路<input id="draft-route" maxlength="200" value="China–Europe"></label><label class="assistant-wide">货物信息<input id="draft-cargo" maxlength="300" placeholder="询价模板使用；品名、件数、重量、体积、日期"></label></div><button id="draft-generate" type="button" class="secondary">生成模板草稿</button><label>主题<input id="draft-subject" maxlength="500"></label><label>正文<textarea id="draft-body" rows="12" maxlength="10000"></textarea></label><div class="assistant-actions"><button id="draft-copy" type="button">复制主题和正文</button><button id="draft-clear" type="button" class="secondary">清空草稿</button><span id="draft-status" role="status"></span></div><p class="footnote">草稿仅保存在当前浏览器标签页；核对收件人、内容及业务信息后，在邮件板块发送。</p></section><p class="assistant-footnote">问答按关键词匹配，不进行复杂推理。未识别的问题可进入对应业务模块继续处理。</p></main><script type="module" src="/src/nav.js"></script><script type="module" src="/src/assistant.js"></script></body></html>
