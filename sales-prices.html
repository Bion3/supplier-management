<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>官网销售价格</title><link rel="stylesheet" href="/src/style.css"><link rel="stylesheet" href="/src/crm.css"><link rel="stylesheet" href="/src/hub.css"></head><body><header></header><main class="hub-main"><section class="hub-heading"><p class="eyebrow">成本中心 / 官网销售价格</p><h1>官网销售价格</h1><p>采购成本 → 成本测算 → 销售价格草稿 → 审核发布。采购成本与利润仅内部可见。</p></section><section id="login-panel" class="panel" hidden><p>请先<a href="/login.html">登录系统</a>。</p></section><div id="workspace" hidden><section class="panel"><div class="toolbar"><label>价格月份<input type="month" id="month"></label><label>运输方式<select id="transport"><option value="">全部</option><option value="fcl">铁路整箱</option><option value="lcl">铁路拼箱</option></select></label><label>状态<select id="status"><option value="">全部</option><option value="draft">待审核</option><option value="active">已发布</option><option value="inactive">已下架</option></select></label><label>路线<input id="search" placeholder="始发地 / 目的地"></label><button id="refresh" class="secondary">刷新</button></div><p id="notice" role="status" aria-live="polite"></p><div class="toolbar"><label>批量利润方式<select id="profit-mode"><option value="markup">成本加成 %</option><option value="margin">销售毛利率 %</option><option value="fixed">固定利润 USD / 票</option></select></label><label>利润参数<input type="number" min="0" step="any" id="profit" value="15"></label><label>报价有效期<input type="date" id="valid-until"></label><button id="reprice" class="secondary">更新所选草稿利润</button><button id="publish">审核并发布所选</button><button id="archive" class="secondary">下架所选价格</button></div><small>批量操作仅处理勾选的记录。价格来源必须完整、成本大于零；过期或缺少有效期的报价不得发布。</small></section><section class="panel"><div class="toolbar"><span id="summary"></span><a class="secondary" href="/cost.html">去成本测算生成草稿 →</a></div><div class="table-wrap"><table><thead><tr><th><input type="checkbox" id="all" aria-label="选中本页"></th><th>路线 / 范围</th><th>方式 / 箱型</th><th>采购成本</th><th>官网售价区间</th><th>利润规则</th><th>有效期</th><th>状态</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div><p id="empty">暂无价格，先在成本测算页生成销售价格草稿。</p><div class="toolbar"><button class="secondary" id="prev">上一页</button><span id="page"></span><button class="secondary" id="next">下一页</button></div></section></div></main><script type="module" src="/src/sales-prices.js"></script><script type="module" src="/src/nav.js"></script></body></html>
