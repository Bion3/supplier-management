<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173f46"><title>供应商管理</title><link rel="stylesheet" href="/src/style.css"></head>
<body><header><div class="brand">S<span>供应商管理 · Supplier Hub</span></div><a href="/crm.html" class="pill">客户资源CRM</a><a href="/knowledge.html" class="pill">货代知识库</a><a href="/mail.html">邮件工作台</a></header><main><section id="login-panel" class="panel"><h2>登录供应商系统</h2><form id="login-form"><label>邮箱<input id="login-email" type="email" autocomplete="username" required></label><label>密码<input id="login-password" type="password" autocomplete="current-password" required></label><p id="login-error" role="alert"></p><button type="submit">登录</button></form></section><p><span id="account"></span> <button id="logout" hidden>退出登录</button></p><div id="workspace" hidden><section class="heading"><div><p class="eyebrow">业务资源管理</p><h1>供应商档案</h1><p>按服务类别和国家区域维护运输、仓储与清关合作伙伴。</p></div><div class="heading-actions"><button id="refresh" class="secondary">刷新</button><button id="add" disabled>＋ 新增供应商</button></div></section><div id="notice" role="status" aria-live="polite"></div><section class="stats" aria-label="供应商统计"><article>供应商总数<strong id="total">0</strong></article><article>合作中<strong id="active">0</strong></article><article>待评估<strong id="pending">0</strong></article></section><section class="panel supplier-list-panel"><div class="supplier-filters"><label class="supplier-search">搜索供应商<input id="search" type="search" placeholder="公司、联系人、电话、邮箱、城市或线路"></label><label>区域<select id="region-filter"><option value="">全部区域</option></select></label><label>国家<select id="country-filter"><option value="">全部国家</option></select></label><label>合作状态<select id="filter"><option value="">全部状态</option><option>合作中</option><option>待评估</option><option>暂停合作</option></select></label><label>排序<select id="sort-filter"><option value="newest">最新录入</option><option value="name">公司名称</option><option value="country">国家 / 城市</option><option value="category">服务类别</option></select></label><button id="clear-supplier-filters" class="secondary">重置</button></div><div class="supplier-category-row" aria-label="供应商类别筛选"><span>服务类别</span><div id="category-filters" class="category-filters"></div></div><div class="supplier-result-bar"><span id="count"></span><span id="filter-summary">全部供应商</span></div><div class="table-wrap"><table class="supplier-table"><thead><tr><th>供应商</th><th>类别</th><th>区域</th><th>国家 / 城市</th><th>联系人</th><th>电话</th><th>邮箱</th><th>合作状态</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div><p id="empty" hidden>暂无供应商，点击“新增供应商”开始录入。</p></section><p class="footnote">数据保存于云端数据库，使用同一授权账号可在不同设备访问。</p></div></main>
<dialog id="editor" aria-labelledby="form-title"><form id="supplier-form"><div class="dialog-heading"><h2 id="form-title">新增供应商</h2><button type="button" id="close" class="secondary" aria-label="关闭表单">✕</button></div><div class="fields"><label>公司名称 *<input name="name" required maxlength="120"></label><label>供应商类别<select name="category"><option>铁路运输</option><option>公路运输</option><option>仓储服务</option><option>清关服务</option><option>综合物流</option><option>其他</option></select></label><label>国家<input name="country" list="supplier-countries" maxlength="80" placeholder="例如：波兰 / Poland"></label><datalist id="supplier-countries"></datalist><label>区域分类<select name="region"><option value="">未分类</option></select></label><label>城市<input name="city" maxlength="120"></label><label>联系人 *<input name="contact" required maxlength="60"></label><label>联系电话<input name="phone" type="tel" maxlength="40"></label><label>联系邮箱<input name="email" type="email" maxlength="120"></label><label>合作状态<select name="status"><option>待评估</option><option>合作中</option><option>暂停合作</option></select></label><label class="wide">服务线路<input name="routes" maxlength="240" placeholder="例如：中国—欧洲、中亚、伊朗"></label><label class="wide">备注<textarea name="notes" rows="3" maxlength="1000"></textarea></label></div><p id="form-error" role="alert"></p><footer><button type="button" id="cancel" class="secondary">取消</button><button type="submit">保存供应商</button></footer></form></dialog><script type="module" src="/src/app.js"></script><script type="module" src="/src/nav.js"></script></body></html>
