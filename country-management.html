<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>国家管理</title><link rel="stylesheet" href="/src/style.css"><link rel="stylesheet" href="/src/hub.css"><link rel="stylesheet" href="/src/master-data.css"></head>
<body><header></header><main>
<section id="login-panel" class="panel"><h2>登录</h2><form id="login-form"><label>邮箱<input name="email" type="email" required autocomplete="username"></label><label>密码<input name="password" type="password" required autocomplete="current-password"></label><button>登录</button></form></section>
<div id="workspace" hidden><section class="panel"><div class="master-filters"><label>搜索<input id="search" type="search" placeholder="中英文名称、代码、币种"></label><label>地理区域<select id="region-filter"></select></label><label>业务区域<select id="business-filter"></select></label><label>状态<select id="status-filter"><option value="all">全部</option><option value="true">启用</option><option value="false">停用</option></select></label><button id="add-country">新增国家/地区</button><button id="refresh-country" class="secondary">刷新</button></div><p id="notice" role="status"></p><p class="master-help">地理区域用于地理分类；业务区域供供应商和展会使用。国家代码固定，旧名称可作为别名。电话、币种按提供资料导入，使用前请核实。</p><div class="table-wrap"><table><thead><tr><th>名称（中文）</th><th>名称（英文）</th><th>ISO2 / 业务代码</th><th>ISO3</th><th>数字编码</th><th>电话编码</th><th>币种</th><th>币种符号</th><th>地理区域</th><th>地理子区域</th><th>业务区域</th><th>排序</th><th>状态</th><th>操作</th></tr></thead><tbody id="master-rows"></tbody></table></div></section></div><dialog id="master-editor"><form id="master-form"><div class="master-dialog-top"><h2 id="editor-title">国家管理</h2><div><button type="button" id="close-master" class="secondary">取消</button> <button id="save-master">保存</button></div></div><div class="master-fields"><label>名称（中文）<input name="name_zh" required maxlength="160"></label><label>名称（英文）<input name="name_en" required maxlength="160"></label><label>ISO2 / 业务代码<input name="iso2" required maxlength="2"></label><label>ISO3<input name="iso3" maxlength="3"></label><label>数字编码<input name="numeric_code" maxlength="3"></label><label>电话编码<input name="dial_code" maxlength="160"></label><label>币种<input name="currency" maxlength="3"></label><label>币种符号<input name="currency_symbol" maxlength="160"></label><label>地理区域<select name="region"></select></label><label>地理子区域<select name="subregion"></select></label><label>业务区域<select name="business_region"></select></label><label>排序<input name="sort_order" type="number" step="1" maxlength="160"></label><label>名称别名<textarea name="aliases" rows="2"></textarea></label><label>备注<textarea name="notes" rows="2"></textarea></label><label>状态<select name="enabled"><option value="true">启用</option><option value="false">停用</option></select></label></div><p id="master-error" role="alert"></p><p class="master-help">停用后不提供给新录入选择，历史记录仍可识别。保存后其他已打开的页面刷新即可使用新口径。</p></form></dialog></main><script type="module" src="/src/country-management.js"></script><script type="module" src="/src/nav.js"></script></body></html>
