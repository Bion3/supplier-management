<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>企业挖掘 · 货代 CRM</title><link rel="stylesheet" href="/src/style.css"><link rel="stylesheet" href="/src/discovery.css"></head><body><header></header><main class="discovery"><section class="heading"><div><p class="eyebrow">客户开发 / 企业发现</p><h1>地图企业挖掘</h1><p>按地区及行业关键词创建搜索任务，核查联系方式，再进入 CRM。</p></div><a href="/crm.html">返回客户资源</a></section><section class="panel"><h2>创建搜索任务</h2><form id="discovery-form"><div class="discovery-grid"><label>国家<input name="country" required value="Germany" maxlength="80"></label><label>城市 / 地区<input name="city" required value="Hamburg" maxlength="120"></label><label>搜索来源<select name="source"><option value="google_places">Google Places API</option></select></label><label>每批目标数量<select name="target_count"><option>100</option><option selected>500</option><option>1000</option></select></label></div><label>关键词，每行一个<textarea name="keywords" rows="4" required>Freight forwarder&#10;Import export company&#10;Wholesale distributor&#10;Logistics company</textarea></label><p class="footnote">仅创建任务记录，不会在浏览器中直接调用 Google API。需要在后端配置 Places API 和合法的企业信息来源；搜索量不保证等于目标数量。</p><button type="submit">保存搜索任务</button><span id="task-notice" role="status"></span></form></section><section class="panel"><div class="discovery-heading"><h2>搜索任务</h2><button id="refresh-tasks" class="secondary">刷新</button></div><div class="table-wrap"><table><thead><tr><th>地区</th><th>关键词</th><th>目标数</th><th>状态</th><th>创建时间</th></tr></thead><tbody id="tasks"></tbody></table></div><p id="tasks-empty"></p></section><section class="panel"><div class="discovery-heading"><h2>企业候选与联系方式</h2><label>状态<select id="lead-status"><option value="">全部</option><option value="pending">待核实</option><option value="reviewed">已审核</option><option value="rejected">不相关</option></select></label></div><div class="table-wrap"><table><thead><tr><th>公司 / 网站</th><th>地区</th><th>联系方式与来源</th><th>验证状态</th><th>审核</th></tr></thead><tbody id="leads"></tbody></table></div><p id="leads-empty"></p><p class="footnote">审核通过不代表允许发送营销邮件。需按国家规定及退订状态确认联系许可；后续可通过独立的 CRM 导入流程完成合并与去重。</p></section></main><script type="module" src="/src/discovery.js"></script><script type="module" src="/src/nav.js"></script></body></html>
