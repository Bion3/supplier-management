<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#173f46"><title>登录</title><link rel="stylesheet" href="/src/login.css"></head><body><main class="login-card"><div class="login-mark" aria-hidden="true">E</div><h1>登录工作台</h1><p class="login-intro">请使用已授权的账号登录</p><form id="login-form"><label for="login-email">邮箱</label><input id="login-email" name="email" type="email" autocomplete="username" inputmode="email" placeholder="请输入邮箱" required><label for="login-password">密码</label><div class="password-field"><input id="login-password" name="password" type="password" autocomplete="current-password" placeholder="请输入密码" required><button id="show-password" type="button" aria-label="显示密码" aria-pressed="false">显示</button></div><p id="login-error" role="alert"></p><button id="login-submit" type="submit">登录</button></form><p id="login-status" role="status" aria-live="polite"></p><p class="login-note">仅供授权人员使用</p><noscript><p>请启用 JavaScript 后登录。</p></noscript></main><script type="module" src="/src/login.js"></script></body></html>
