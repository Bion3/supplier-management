<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>境外配送成本</title><link rel="stylesheet" href="/src/style.css"><link rel="stylesheet" href="/src/crm.css"><link rel="stylesheet" href="/src/cost.css"><link rel="stylesheet" href="/src/hub.css"><link rel="stylesheet" href="/src/price-table-ui.css"></head><body><header></header><main><section id="login-panel" class="panel"><h2>登录境外配送成本</h2><form id="login-form"><label>邮箱<input name="email" type="email" required autocomplete="username"></label><label>密码<input name="password" type="password" required autocomplete="current-password"></label><button>登录</button></form></section><p id="notice" role="status"></p><div id="workspace" hidden><nav class="price-module-tabs" aria-label="配送分类"><a href="/overseas-delivery.html?type=fcl" data-delivery-tab="fcl">整柜配送</a><a href="/overseas-delivery.html?type=lcl" data-delivery-tab="lcl">拼箱配送</a></nav><section class="heading"><div><h1>境外配送成本</h1><p>整柜与拼箱分别维护；单票参考价保留适用货量、清关及卸货条件。</p></div><div><button id="add">新增配送价</button> <button id="confirm-selected" class="secondary" disabled>批量确认</button> <button id="bulk-edit" class="secondary" disabled>批量修改</button> <button id="disable-selected" class="secondary" disabled>批量停用</button></div></section><section class="panel"><div class="toolbar fcl-toolbar"><label>搜索<input id="search" type="search" placeholder="起运站 / 仓、提货仓 / 地址、目的地、备注"></label><label>供应商<select id="supplier-filter"><option value="">全部</option></select></label><label>箱型<select id="box-filter"><option value="">全部</option></select></label><label>配送类型<select id="scope-filter"><option value="">全部</option></select></label><label>有效期<select id="validity-filter"><option value="">全部</option><option value="valid">当前有效</option><option value="expired">已过期</option><option value="future">未生效</option><option value="unknown">未注明</option></select></label><label>币种<select id="currency-filter"><option value="">全部</option><option>USD</option><option>CNY</option><option>EUR</option><option value="unknown">待确认</option></select></label><label>状态<select id="status-filter"><option value="">使用中</option><option value="draft">待确认</option><option value="confirmed">启用</option><option value="inactive">停用</option><option value="all">全部</option></select></label></div><div class="toolbar"><button id="select-filtered" type="button" class="secondary">选择全部筛选结果</button><button id="clear-selected" type="button" class="secondary">清空选择</button><span id="selection-info"></span></div><div class="table-wrap"><table class="data-columns"><thead><tr><th class="select-col"><input id="select-page" type="checkbox" aria-label="选择当前页"></th><th>起运站 / 仓</th><th>提货仓 / 地址</th><th>目的地</th><th>供应商</th><th>配送类型</th><th>箱型 / 件重体</th><th>配送价</th><th>价格口径</th><th>有效期</th><th>状态</th><th>操作</th></tr></thead><tbody id="trucking-rows"></tbody></table></div></section></div></main><dialog id="editor" class="supplier-quote-dialog"><form id="quote-form"><div class="dialog-heading"><h2>境外配送成本维护</h2><button type="button" id="close" class="secondary">关闭</button></div><div id="fields" class="fields"></div><details><summary>单项附加费</summary><p>仅记录另计项目，留空金额表示待确认；包含费用写入说明。</p><div id="fee-items"></div><button type="button" id="add-fee" class="secondary">添加费用</button></details><details><summary>利润预设（预留）</summary><p>采购价保持原供应商成本；利润预设供后续报价功能使用。</p><div class="fields"><label>方式<select name="profitMode"><option value="markup">成本加成 %</option><option value="margin">销售毛利率 %</option><option value="fixed">固定利润（采购币种）</option></select></label><label>数值<input name="profitValue" type="number" min="0" step="any" value="0"></label></div></details><label>费用包含、限制及待确认说明<textarea name="notes" rows="5"></textarea></label><details><summary>原始报价来源</summary><p id="source" style="white-space:pre-wrap"></p></details><p id="error" role="alert"></p><footer><button id="save">保存新版本</button></footer></form></dialog><script type="module" src="/src/overseas-delivery.js"></script><script type="module" src="/src/nav.js"></script></body></html>
