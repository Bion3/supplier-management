<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>行业名录与资源 · Eurasiago CRM</title><link rel="stylesheet" href="/src/style.css"><link rel="stylesheet" href="/src/industry-resources.css"></head><body><header></header><main><div id="workspace" hidden><section class="heading"><div><p class="eyebrow">客户开发</p><h1>行业名录与资源</h1><p>按行业寻找客户，企业与联系方式直接进入客户工作台。</p></div><div class="actions"><a class="pill" href="/crm.html">客户跟进</a><button id="refresh" class="secondary">刷新</button><button id="add-source">新增资源</button></div></section><p id="notice" role="status" aria-live="polite"></p><div class="resource-tabs" role="tablist"><button role="tab" aria-selected="true" data-tab="sources">名录资源</button><button role="tab" aria-selected="false" data-tab="entries">已采集企业</button><button role="tab" aria-selected="false" data-tab="runs">采集记录</button></div><section class="panel"><div class="toolbar"><label>搜索<input id="query" type="search" placeholder="资源或企业名称"></label><label>行业<select id="industry"><option value="">全部行业</option></select></label><label id="region-label">地区<select id="region"><option value="">全部地区</option></select></label><label id="country-label" hidden>国家<input id="country" placeholder="如德国、波兰"></label><label>状态<select id="state"><option value="">全部状态</option></select></label><span id="summary"></span></div><p id="guide" class="resource-guide">每日增量采集；已检查且无新线索的企业不重复补全。ENF等既有任务独立运行，参考资源不自动入库。</p><div id="content" aria-busy="false"></div><div class="pager"><button id="prev" class="secondary">上一页</button><span id="page"></span><button id="next" class="secondary">下一页</button></div></section></div></main><dialog id="source-editor"><form id="source-form"><div class="dialog-heading"><h2 id="editor-title">新增资源</h2><button type="button" id="close-editor" class="secondary">关闭</button></div><div class="fields"><label>代码<input name="code" required pattern="[A-Z0-9_-]+" placeholder="如 PACKAGING_ASSOC"></label><label>名称<input name="name" required maxlength="200"></label><label>行业<input name="industry" required list="industries"></label><datalist id="industries"></datalist><label>国家 / 地区<input name="region" required value="全球"></label><label>资源类型<select name="resource_type"><option>行业名录</option><option>协会会员</option><option>综合B2B</option><option>市场资源</option></select></label><label>入口网址<input name="url" type="url" required></label><label>优先级<select name="priority"><option value="1">优先</option><option value="2" selected>普通</option><option value="3">次优先</option></select></label><label>采集方式<select name="collection_mode"><option>每日增量</option><option>现有任务</option><option>资源参考</option></select></label><label>说明<textarea name="notes" rows="3"></textarea></label></div><p id="editor-error" role="alert"></p><button type="submit">保存资源</button></form></dialog><script type="module" src="/src/industry-resources.js"></script><script type="module" src="/src/nav.js"></script></body></html>
