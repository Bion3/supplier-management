<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>本地提货价模板</title><link rel="stylesheet" href="/src/style.css"><link rel="stylesheet" href="/src/crm.css"><link rel="stylesheet" href="/src/cost.css"><link rel="stylesheet" href="/src/hub.css"><link rel="stylesheet" href="/src/price-table-ui.css"></head><body><header></header><main><section id="login-panel" class="panel"><h2>登录提货价模板</h2><form id="login-form"><label>邮箱<input name="email" type="email" required autocomplete="username"></label><label>密码<input name="password" type="password" required autocomplete="current-password"></label><button>登录</button></form></section><p id="notice" role="status"></p><div id="workspace" hidden><section class="heading"><div><h1>本地提货价格</h1><p>全部提货地共用一套阶梯价；仅适用于对应收货仓100公里内。按体积与毛重同时取档。</p></div><button id="add" class="secondary">新增专属模板</button></section><section class="panel pickup-panel"><div class="table-wrap"><table class="data-columns pickup-table"><thead><tr><th>模板名称</th><th>适用区域</th><th>供应商</th><th>币种</th><th>阶梯价格</th><th>生效日期</th><th>有效期至</th><th>状态</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div></section></div></main><dialog id="editor"><form id="template-form"><div class="dialog-heading"><h2>维护提货价模板</h2><button type="button" id="close" class="secondary">关闭</button></div><div class="fields"><label>模板名称<input name="name" required></label><label>币种<select name="currency"><option>USD</option><option>CNY</option></select></label><label>适用始发地（留空为所有提货地）<input name="areas" placeholder="全部提货地"></label><label>状态<select name="status"><option value="confirmed">启用</option><option value="draft">待确认</option><option value="inactive">停用</option></select></label><label>生效日期<input name="validFrom" type="date"></label><label>有效期至<input name="validUntil" type="date"></label><label>供应商（可选）<select name="supplier_id"></select></label><label>来源 / 版本<input name="source"></label></div><h3>提货费阶梯（每票固定金额）</h3><label>套档方式<select name="tierMode"><option value="ceil">按体积、重量上限取档（跨档取高，小票按首档）</option><option value="strict">体积和重量同时落入区间</option></select></label><p>体积和重量同时满足某档上限时取最低适用档；超过最大档请人工询价。仅限收货仓100公里范围内。</p><div id="tiers"></div><button type="button" id="add-tier" class="secondary">添加阶梯</button><p id="error" role="alert"></p><footer><button id="save">保存模板新版本</button></footer></form></dialog><script type="module" src="/src/pickup-rates.js"></script><script type="module" src="/src/purchase-selling-prices.js"></script><script type="module" src="/src/nav.js"></script></body></html>
