<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>收件箱 · Eurasiago</title><link rel="stylesheet" href="/src/style.css"><link rel="stylesheet" href="/src/mail.css"></head><body><header></header><main><section id="login-panel" class="panel"><h2>登录收件箱</h2><form id="login-form"><label>邮箱<input id="login-email" type="email" autocomplete="username" required></label><label>密码<input id="login-password" type="password" autocomplete="current-password" required></label><p id="login-error" role="alert"></p><button type="submit">登录</button></form></section>
<p><span id="account"></span> <button id="logout" hidden>退出登录</button></p><div id="workspace" hidden><section class="heading"><div><h1>收件箱</h1><p>查看 benjamin@eurasiago.com 的来信与客户回复。</p></div><div class="heading-actions"><button id="refresh" class="secondary">刷新</button><a href="/mail.html" class="mail-page-link">进入邮件发送</a></div></section><p id="notice" role="status" aria-live="polite"></p><section id="inbox-panel" class="panel history"><div class="dialog-heading"><h2>收件箱与客户回复</h2><button id="sync-inbox">立即同步</button></div><p id="inbox-status" role="status"></p><label>搜索来信<input id="inbox-search" placeholder="发件人、主题或正文"></label><p id="inbox-count"></p><div class="table-wrap"><table><thead><tr><th>收信时间</th><th>发件人</th><th>主题</th><th>客户关联</th><th>操作</th></tr></thead><tbody id="inbox-rows"></tbody></table></div></section><p id="inbox-empty" class="footnote" hidden></p></div></main><dialog id="inbox-detail"><div class="dialog-heading"><h2 id="inbox-detail-title"></h2><button id="inbox-detail-close" class="secondary">关闭</button></div><p id="inbox-detail-from"></p><p id="inbox-detail-risk"></p><pre id="inbox-detail-body" style="white-space:pre-wrap;overflow-wrap:anywhere"></pre><p id="inbox-detail-attachments"></p></dialog><script type="module" src="/src/mail-inbox.js"></script><script type="module" src="/src/nav.js"></script></body></html>
