<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>成本测算</title><link rel="stylesheet" href="/src/style.css"><link rel="stylesheet" href="/src/crm.css"><link rel="stylesheet" href="/src/cost.css"></head><body><header><div class="brand">C<span>成本测算</span></div><nav><a href="/rates.html">采购价库</a> <a href="/">供应商</a></nav></header><main><section id="login-panel" class="panel"><h2>登录成本测算</h2><form id="login-form"><label>邮箱<input name="email" type="email" required autocomplete="username"></label><label>密码<input name="password" type="password" required autocomplete="current-password"></label><button>登录</button></form></section><p id="notice" role="status"></p><div id="workspace" hidden><section class="heading"><div><h1>铁路拼箱成本测算</h1><p>输入起讫地点和件毛体，自动读取采购价核算。</p></div><button id="logout" class="secondary">退出</button></section><section class="panel"><form id="goods"><div class="fields"><label>起始地<input id="origin" required placeholder="如上海"></label><label>目的地<input id="destination" required placeholder="如汉堡"></label><label>件数<input id="pieces" type="number" min="1" step="1" required></label><label>毛重 kg<input id="weight" type="number" min="0.001" step="any" required></label><label>体积 CBM<input id="volume" type="number" min="0.001" step="any" required></label></div><footer><button>获取价格并核算</button></footer></form></section><section class="panel"><div id="alternatives" hidden><label>匹配到多个铁路方案<select id="options"></select></label></div><div id="result"><p>填写货物信息后开始核算。</p></div><footer><button id="save" disabled>保存测算</button></footer></section><details class="panel"><summary>历史测算</summary><div id="history"></div></details></div></main><script type="module" src="/src/cost-auto.js"></script><script type="module" src="/src/nav.js"></script></body></html>
