<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>成本测算</title><link rel="stylesheet" href="/src/style.css"><link rel="stylesheet" href="/src/crm.css"><link rel="stylesheet" href="/src/cost.css"></head><body><header></header><main><section id="login-panel" class="panel"><h2>登录成本测算</h2><form id="login-form"><label>邮箱<input name="email" type="email" required autocomplete="username"></label><label>密码<input name="password" type="password" required autocomplete="current-password"></label><button>登录</button></form></section><p id="notice" role="status"></p><div id="workspace" hidden><section class="heading"><div><h1>报价核算</h1><p>输入货物与运输线路，按费用段检查采购成本、备选价格和未补全项目。</p></div><a href="/pricing.html" class="secondary">维护采购价格 →</a></section><section class="panel"><form id="goods"><div class="fields"><label>运输方式<select id="transport"><option value="lcl">铁路拼箱</option><option value="fcl">铁路整箱</option></select></label><label data-lcl>核算范围<select id="scope"><option value="door">始发地至境外目的站</option><option value="station">国内站至境外目的站</option></select></label><label id="origin-field">装箱地 / 始发地<input id="origin" placeholder="如宁波市、鄞州区"></label><label id="station-field">国内起运站<input id="station" placeholder="如西安（整柜建议明确填写）"></label><label>境外目的站<input id="destination" required placeholder="如汉堡"></label><label data-lcl>件数<input id="pieces" type="number" min="1" step="1"></label><label data-lcl>毛重 kg<input id="weight" type="number" min="0.001" step="any"></label><label data-lcl>体积 CBM<input id="volume" type="number" min="0.001" step="any"></label><label data-fcl hidden>箱型<select id="box"><option>40HQ</option><option>40GP</option><option>20GP</option><option>45HQ</option></select></label><label data-fcl hidden>柜量<input id="quantity" type="number" min="1" step="1" value="1"></label><label data-fcl hidden>用箱<select id="equipment"><option>SOC</option><option>COC</option></select></label></div><div class="cost-switches" data-fcl hidden><label><input id="truck" type="checkbox">包含国内拖车</label><label><input id="rent" type="checkbox">包含SOC租箱</label><label><input id="preview" type="checkbox">使用待确认参考价（仅暂估）</label></div><div id="pickup-place-wrap" data-fcl hidden><label>提空箱地（国内拖车时填写）<input id="pickupPlace" placeholder="如宁波"></label></div><details data-lcl><summary>提货费选择 / 本票补价</summary><div class="fields"><label>提货方式<select id="pickupMode"><option value="auto">自动匹配，可在结果中切换模板</option><option value="manual">本票临时金额（不改价格库）</option></select></label><label>临时提货费 / 票<input id="pickupAmount" type="number" min="0" step="any"></label><label>币种<select id="pickupCurrency"><option>USD</option><option>CNY</option></select></label><label>临时补价原因<input id="pickupReason" placeholder="如车队本票确认价"></label></div></details><details id="cost-advanced"><summary>报价日期、汇率和利润设置</summary><div class="fields"><label>报价适用日期<input id="date" type="date" required></label><label>1 USD = 人民币<input id="fx" type="number" min="0.001" step="any" value="7" required></label><label>1 EUR = USD（涉及欧元时填写）<input id="eurFx" type="number" min="0.001" step="any"></label><label>内部测算利润方式<select id="profitMode"><option value="markup">成本加成 %</option><option value="margin">销售毛利率 %</option><option value="fixed">固定利润 USD / 票</option></select></label><label>内部测算利润数值<input id="profit" type="number" min="0" step="any" value="15" required></label><label>报价区间 ± %<input id="webRange" type="number" min="0" max="30" step="any" value="5" required></label><label>报价最低收费 USD<input id="webMinimum" type="number" min="0" step="any" value="300" required></label><label>报价有效期至<input id="webValidUntil" type="date"></label></div><p>采购价和卖价在采购价格表维护；这里仅做组合成本测算，不再创建独立官网售价草稿。</p></details><footer class="cost-main-actions"><span class="cost-form-hint">默认仅核算铁路站到站，需要时勾选拖车或租箱。</span><button id="compute">查询并核算报价</button></footer></form></section><section class="panel cost-output"><div class="cost-output-title"><h2>报价核算</h2><span>采购价格组合 · 缺失诊断 · 逐项补全</span></div><div id="alternatives" hidden><label>铁路拼箱方案<select id="options"></select></label></div><div id="segments" class="fields"></div><section id="supplier-comparison" class="cost-supplier-comparison" hidden><div class="cost-compare-title"><h3>供应商备选报价</h3><small>对比供应商后选用，自动重新核算；缺失项在下方价格组合表提示</small></div><div id="comparison-rows"></div></section><div id="match-diagnostics" role="status" hidden></div><div id="result"><p>输入线路和货物信息后，点击“查询并核算报价”，系统将列出费用组合及缺失原因。</p></div><footer><button id="save" disabled>保存成本快照</button><button id="publish" class="secondary" hidden disabled>已停用的旧草稿入口</button></footer></section><details class="panel"><summary>历史测算</summary><div id="history"></div></details></div></main><script type="module" src="/src/cost-auto.js"></script><script type="module" src="/src/nav.js"></script></body></html>
