<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>成本测算</title><link rel="stylesheet" href="/src/style.css"><link rel="stylesheet" href="/src/crm.css"><link rel="stylesheet" href="/src/cost.css"></head><body><header></header><main><section id="login-panel" class="panel"><h2>登录成本测算</h2><form id="login-form"><label>邮箱<input name="email" type="email" required autocomplete="username"></label><label>密码<input name="password" type="password" required autocomplete="current-password"></label><button>登录</button></form></section><p id="notice" role="status"></p><div id="workspace" hidden><section class="heading"><div><h1>成本测算</h1><p>输入路线与货物，从采购价格库组合核算至境外目的站。</p></div><a href="/pricing.html" class="secondary">维护采购价格 →</a></section><section class="panel"><form id="goods"><div class="fields"><label>运输方式<select id="transport"><option value="lcl">铁路拼箱</option><option value="fcl">铁路整箱</option></select></label><label data-lcl>核算范围<select id="scope"><option value="door">始发地至境外目的站</option><option value="station">国内站至境外目的站</option></select></label><label>装箱地 / 始发地<input id="origin" placeholder="如宁波市、鄞州区"></label><label>国内起运站<input id="station" placeholder="如西安；拼箱可留空自动匹配"></label><label>境外目的站<input id="destination" required placeholder="如汉堡"></label><label>报价适用日期<input id="date" type="date" required></label><label data-lcl>件数<input id="pieces" type="number" min="1" step="1"></label><label data-lcl>毛重 kg<input id="weight" type="number" min="0.001" step="any"></label><label data-lcl>体积 CBM<input id="volume" type="number" min="0.001" step="any"></label><label data-fcl hidden>箱型<select id="box"><option>40HQ</option><option>40GP</option><option>20GP</option><option>45HQ</option></select></label><label data-fcl hidden>柜量<input id="quantity" type="number" min="1" step="1" value="1"></label><label data-fcl hidden>用箱<select id="equipment"><option>SOC</option><option>COC</option></select></label><label data-fcl hidden>提空箱地<input id="pickupPlace" placeholder="含拖车时填写，如宁波"></label></div><div class="cost-switches" data-fcl hidden><label><input id="truck" type="checkbox" checked>包含国内拖车</label><label><input id="rent" type="checkbox" checked>包含SOC租箱</label><label><input id="preview" type="checkbox">允许待确认参考价（仅暂估）</label></div><details data-lcl><summary>提货费选择 / 本票补价</summary><div class="fields"><label>提货方式<select id="pickupMode"><option value="auto">自动匹配，可在结果中切换模板</option><option value="manual">本票临时金额（不改价格库）</option></select></label><label>临时提货费 / 票<input id="pickupAmount" type="number" min="0" step="any"></label><label>币种<select id="pickupCurrency"><option>USD</option><option>CNY</option></select></label><label>临时补价原因<input id="pickupReason" placeholder="如车队本票确认价"></label></div></details><details><summary>汇率与利润</summary><div class="fields"><label>1 USD = 人民币<input id="fx" type="number" min="0.001" step="any" value="7" required></label><label>1 EUR = USD（涉及欧元时填写）<input id="eurFx" type="number" min="0.001" step="any"></label><label>利润方式<select id="profitMode"><option value="markup">成本加成 %</option><option value="margin">销售毛利率 %</option><option value="fixed">固定利润 USD / 票</option></select></label><label>利润数值<input id="profit" type="number" min="0" step="any" value="0" required></label></div><p>汇率由本次输入确认，不是实时汇率；默认不加利润。</p></details><footer><button id="compute">匹配价格并核算</button></footer></form></section><section class="panel"><div id="alternatives" hidden><label>铁路拼箱方案<select id="options"></select></label></div><div id="segments" class="fields"></div><div id="result"><p>选择运输方式，填写路线后开始核算。</p></div><footer><button id="save" disabled>保存测算快照</button></footer></section><details class="panel"><summary>历史测算</summary><div id="history"></div></details></div></main><script type="module" src="/src/cost-auto.js"></script><script type="module" src="/src/nav.js"></script></body></html>
