<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>展会与展商</title><link rel="stylesheet" href="/src/style.css"><link rel="stylesheet" href="/src/exhibitions.css"></head><body><header></header><main><section class="heading"><div><p class="eyebrow">展会获客</p><h1>展会与展商</h1><p>自动收集2025、2026年历史展会及未来展会，按届次归档展商目录。</p></div><div class="expo-actions"><button id="sync-history" class="secondary">自动采集记录</button><button id="refresh" class="secondary">刷新</button><button id="add-entry">新增展会</button><button id="import-open" class="secondary">批量导入 CSV</button></div></section><p id="notice" role="status" aria-live="polite"></p><nav class="expo-tabs" aria-label="展会工作区"><button id="tab-fairs" aria-pressed="true">展会库</button><button id="tab-exhibitors" aria-pressed="false">展商目录</button></nav><section class="panel expo-panel"><div class="expo-filters"><label>搜索<input id="query" placeholder="名称、产品、标签或备注"></label><label id="fair-filter-label" hidden>所属展会<select id="fair-filter"></select></label><label>年份<select id="year-filter"></select></label><label>地区<select id="region-filter"></select></label><label>行业大类<select id="category-filter"></select></label><label>展会级别<select id="tier-filter"></select></label><label>展会类型<select id="exhibition-type-filter"></select></label><label>来源平台<select id="platform-filter"></select></label><label>国家<select id="country-filter"></select></label><label>行业<select id="industry-filter"></select></label><label>核实状态<select id="status-filter"></select></label><label id="type-filter-label" hidden>企业类型<select id="type-filter"></select></label><label id="tag-filter-label" hidden>标签<select id="tag-filter"></select></label><label id="period-label">时间范围<select id="period-filter"><option value="">全部日期</option><option value="upcoming">即将举办</option><option value="ongoing">正在举办</option><option value="past">已结束</option></select></label><button id="clear-filters" class="secondary">清空筛选</button></div><div class="expo-actions expo-bulk"><span id="summary"></span><button id="select-filtered" class="secondary" hidden>选择全部筛选结果</button><button id="clear-selection" class="secondary" hidden>取消选择</button><button id="bulk-open" hidden>批量分类</button><button id="expo-contact-complete" class="secondary" hidden type="button">补全所选展商联系方式（每批100家）</button><button id="export" class="secondary">导出筛选结果</button></div><div class="table-wrap" id="expo-table"><table><thead id="table-head"></thead><tbody id="rows"></tbody></table></div><p id="empty" class="expo-empty" hidden>暂无记录，可新增或批量导入。</p></section><details class="panel expo-sources"><summary>采集来源与分级标准</summary><p id="tier-guide"></p><div id="source-links"></div><p>平台收录用于发现线索，默认待核实；官网、协会和认证来源优先复核。仅展示已实际入库的数据，未采集平台不代表已经覆盖。</p></details><p class="footnote">每天早间采集官网信息，来源冲突保留为待采用更新。收录参展信息不代表企业存在运输需求。导入的记录默认待核实，请保留目录届次、来源和核实日期。</p></main><dialog id="entry-dialog"><form id="entry-form"><div class="dialog-heading"><h2 id="entry-title"></h2><button class="secondary" type="button" id="entry-close">关闭</button></div><div id="entry-fields" class="fields"></div><p id="entry-error" role="alert"></p><footer><button type="submit" id="entry-save">保存</button></footer></form></dialog><dialog id="import-dialog"><div class="dialog-heading"><h2>批量导入目录</h2><button id="import-close" class="secondary">关闭</button></div><p id="import-context"></p><p>使用 UTF-8 CSV 文件，日期填写 YYYY-MM-DD，每次最多2000条；导入前检查预览，重复记录跳过，核实状态统一设为待核实。</p><button id="download-template" class="secondary">下载模板</button><label>选择 CSV 文件<input id="import-file" type="file" accept=".csv,text/csv"></label><p id="import-summary" role="status"></p><pre id="import-preview"></pre><p id="import-error" role="alert"></p><footer><button id="import-confirm" disabled>确认导入</button></footer></dialog><dialog id="bulk-dialog"><form id="bulk-form"><div class="dialog-heading"><h2>批量分类</h2><button id="bulk-close" type="button" class="secondary">关闭</button></div><p id="bulk-count"></p><label>行业（空白不修改）<input name="industry" maxlength="120"></label><label>企业类型（空白不修改）<select name="company_type" id="bulk-type"></select></label><label>标签（追加，分号分隔）<input name="tags" maxlength="500"></label><p id="bulk-error" role="alert"></p><footer><button type="submit" id="bulk-save">保存分类</button></footer></form></dialog><script type="module" src="/src/exhibitions.js"></script><script type="module" src="/src/nav.js"></script></body></html>
