<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>国内仓库 · 基础信息</title><link rel="stylesheet" href="/src/style.css"><link rel="stylesheet" href="/src/hub.css"><link rel="stylesheet" href="/src/master-data.css"><link rel="stylesheet" href="/src/domestic-warehouses.css"></head>
<body><header></header><main>
<section id="login-panel" class="panel"><h2>登录</h2><form id="login-form"><label>邮箱<input name="email" type="email" required autocomplete="username"></label><label>密码<input name="password" type="password" required autocomplete="current-password"></label><button>登录</button></form></section>
<div id="workspace" hidden><section class="master-heading"><div><p class="eyebrow">REFERENCE DATA</p><h1>国内仓库</h1><p>维护集货、装箱及拆箱仓库，保留送仓预约和收货要求。</p></div><button id="add-warehouse">新增仓库</button></section>
<nav class="master-tabs"><a class="button secondary" href="/master-data.html">地点 / 费用项目</a><button aria-pressed="true">国内仓库</button><a class="button secondary" href="/country-management.html">国家管理</a></nav>
<section class="panel"><form id="filters" class="master-filters"><label>搜索<input name="search" placeholder="仓库、地址、联系人、电话"></label><label>类型<select name="type"><option value="">全部</option><option>集货仓</option><option>装箱仓</option><option>拆箱仓</option></select></label><label>所属口岸<input name="port" placeholder="如西安、武汉"></label><label>供应商<input name="supplier" placeholder="供应商名称"></label><label>状态<select name="status"><option value="true">启用</option><option value="">全部</option><option value="false">停用</option></select></label><button>查询</button><button type="reset" class="secondary">重置</button></form><p id="notice" role="status"></p><div class="table-wrap"><table><thead><tr><th>仓库名称</th><th>仓库类型</th><th>所属口岸</th><th>供应商</th><th>国家</th><th>详细地址</th><th>收费说明</th><th>营业时间</th><th>联系人</th><th>联系方式</th><th>状态</th><th>操作</th></tr></thead><tbody id="master-rows"></tbody></table></div><div class="pager"><button id="prev" class="secondary">上一页</button><span id="page-label"></span><button id="next" class="secondary">下一页</button></div></section></div>
<dialog id="master-editor"><form id="master-form"><div class="master-dialog-top"><h2 id="editor-title">新增仓库</h2><div><button type="button" id="close-master" class="secondary">取消</button> <button id="save-master">保存</button></div></div><div class="master-fields"><label>仓库名称<input name="name" required maxlength="120"></label><label>仓库类型<select name="warehouse_type"><option>集货仓</option><option>装箱仓</option><option>拆箱仓</option></select></label><label>所属口岸<input name="port" maxlength="500"></label><label>供应商<input name="supplier" maxlength="500"></label><label>国家<input name="country" maxlength="500"></label><label class="full">详细地址<textarea name="address" rows="3" maxlength="6000"></textarea></label><label class="full">收费说明<textarea name="charges" rows="3" maxlength="6000"></textarea></label><label>营业时间<textarea name="hours" rows="3" maxlength="6000"></textarea></label><label>联系人<input name="contact" maxlength="500"></label><label>联系方式<textarea name="phone" rows="3" maxlength="6000"></textarea></label><label class="full">备注<textarea name="notes" rows="3" maxlength="6000"></textarea></label><label>状态<select name="enabled"><option value="true">启用</option><option value="false">停用</option></select></label></div><p id="master-error" role="alert"></p><p class="master-help">缺失信息留空；多个联系方式可分行填写。收费说明不代表已确认的报价或有效期。</p></form></dialog></main><script type="module" src="/src/domestic-warehouses.js"></script><script type="module" src="/src/nav.js"></script></body></html>
