<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>拼箱铁路运费中心</title><link rel="stylesheet" href="/src/style.css"><link rel="stylesheet" href="/src/crm.css"><link rel="stylesheet" href="/src/cost.css"><link rel="stylesheet" href="/src/hub.css"></head><body><header></header><main><section id="login-panel" class="panel"><h2>登录成本中心</h2><form id="login-form"><label>邮箱<input name="email" type="email" required autocomplete="username"></label><label>密码<input name="password" type="password" required autocomplete="current-password"></label><button>登录</button></form></section><p id="notice" role="status"></p><div id="workspace" hidden><section class="heading"><div><h1>拼箱铁路运费中心</h1><p>各线路铁路拼箱采购单价，供成本测算直接调用。</p></div><div><button id="new">新增外采运费</button> <button id="new-own" class="secondary">新增自营折算</button> <button id="batch-add" class="secondary">批量添加</button> <button id="batch-edit" class="secondary" disabled>批量修改</button> <button id="batch-delete" class="secondary" disabled>批量删除</button> <button id="logout" class="secondary">退出</button></div></section><section class="panel"><div class="toolbar"><label>搜索<input id="rail-search" placeholder="起运站、目的站、供应商、标签"></label><label>来源<select id="rail-mode"><option value="">全部</option><option value="own">自营</option><option value="external">外采</option></select></label><label>起运站<input id="filter-origin"></label><label>目的站<input id="filter-destination"></label><label>供应商<select id="filter-supplier"><option value="">全部</option></select></label><label>有效状态<select id="filter-status"><option value="active">使用中</option><option value="valid">有效期内</option><option value="expired">已过期</option><option value="future">尚未生效</option><option value="pending">待补费用</option><option value="inactive">已删除 / 停用</option><option value="all">全部</option></select></label></div><p id="selection-info"></p><div class="table-wrap"><table class="data-columns"><thead><tr><th class="select-col"><input id="rail-select-page" type="checkbox" aria-label="选择当前页"></th><th>起运站</th><th>目的站</th><th>来源</th><th>供应商</th><th>标签</th><th>运费单价</th><th>重抛比</th><th>生效日期</th><th>有效期至</th><th>费用完整性</th><th>启用状态</th><th>操作</th></tr></thead><tbody id="history"></tbody></table></div><div class="pager"><button id="rail-prev" class="secondary">上一页</button><span id="rail-count"></span><button id="rail-next" class="secondary">下一页</button></div></section></div></main><dialog id="rail-editor" class="detail-dialog"><div class="dialog-heading"><h2 id="editor-title">铁路运费录入</h2><button id="close-editor" class="secondary">关闭</button></div><label>供应商标签<input id="supplier-tags" placeholder="如直采、主力、备选，用逗号分隔"></label><section class="panel"><h2>铁路采购参数</h2><div class="fields"><label>起运站<input id="plan-origin" value="西安" required></label><label>目的站<input id="plan-destination" value="汉堡" required></label><label>有效期起<input id="plan-from" type="date"></label><label>有效期止<input id="plan-until" type="date"></label></div><div id="inputs" class="fields"></div></section><details id="own-section" class="panel"><summary>自营整柜成本与备用供应商</summary><div id="own"></div></details><details id="external-section" class="panel"><summary>外采供应商与备用供应商</summary><p>运费、杂费均为USD；请在杂费合计填写所有另计费用，已含费用记录在包含说明中。</p><div id="external"></div></details><section class="panel"><h2>铁路运费单位成本</h2><div id="result"></div></section><footer><button id="save">保存线路运费</button></footer></dialog><dialog id="batch-dialog"><form id="batch-form"><div class="dialog-heading"><h2 id="batch-title">批量操作</h2><button type="button" id="close-batch" class="secondary">关闭</button></div><div id="batch-fields"></div><p id="batch-error" role="alert"></p><footer><button id="batch-submit">保存</button></footer></form></dialog><script type="module" src="/src/rail-pricing.js"></script><script type="module" src="/src/nav.js"></script></body></html>
