<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>国际物流成本中心</title><link rel="stylesheet" href="/src/style.css"><link rel="stylesheet" href="/src/crm.css"><link rel="stylesheet" href="/src/cost.css"></head><body><header><div class="brand">C<span>国际物流成本中心</span></div><nav><a href="/rates.html">国内采购价库</a> <a href="/">供应商</a> <a href="/crm.html">客户资源</a> <a href="/knowledge.html">知识库</a></nav></header><main><section id="login-panel" class="panel"><h2>登录成本中心</h2><form id="login-form"><label>邮箱<input name="email" type="email" required autocomplete="username"></label><label>密码<input name="password" type="password" required autocomplete="current-password"></label><button>登录</button></form></section><p id="notice" role="status"></p><div id="workspace" hidden><section class="heading"><div><p class="eyebrow">采购成本 · 供应商备选 · 利润报价</p><h1>铁路运费单价成本</h1><p>自营整柜成本折算为铁路单位成本，或录入外配采购单价，供综合成本测算调用。</p></div><div><button id="save">保存铁路单价成本</button> <button id="new" class="secondary">新采购方案</button> <button id="logout" class="secondary">退出</button></div></section><section class="panel"><h2>铁路采购参数</h2><div class="fields"><label>起运站<input id="plan-origin" value="西安" required></label><label>目的站<input id="plan-destination" value="汉堡" required></label><label>有效期起<input id="plan-from" type="date"></label><label>有效期止<input id="plan-until" type="date"></label></div><div id="inputs" class="fields"></div></section><details class="panel"><summary>自营整柜成本与备用供应商</summary><div id="own"></div></details><details class="panel"><summary>外配拼箱商与备用供应商</summary><p>运费、杂费均为USD；请在杂费合计填写所有另计费用，已含费用记录在包含说明中。</p><div id="external"></div></details><section class="panel"><h2>铁路运费单位成本</h2><div id="result"></div></section><details class="panel"><summary>采购方案版本</summary><p>加载历史记录只生成可编辑副本；再次保存产生新快照，历史采购价和利润保持原值。</p><div id="history"></div></details></div></main><script type="module" src="/src/rail-pricing.js"></script><script type="module" src="/src/nav.js"></script></body></html>
