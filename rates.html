<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>国内采购价库</title><link rel="stylesheet" href="/src/style.css"><link rel="stylesheet" href="/src/crm.css"><link rel="stylesheet" href="/src/cost.css"></head><body><header><div class="brand">C<span>国内采购价库</span></div><nav><a href="/cost.html">成本测算</a> <a href="/rail-rates.html">铁路采购方案</a> <a href="/">供应商</a></nav></header><main><section id="login-panel" class="panel"><h2>登录采购价库</h2><form id="login-form"><label>邮箱<input name="email" type="email" required autocomplete="username"></label><label>密码<input name="password" type="password" required autocomplete="current-password"></label><button>登录</button></form></section><p id="notice" role="status"></p><div id="workspace" hidden><section class="heading"><div><h1>国内提货与干线</h1><p>按区域、目的仓选价，修改价格生成新版本。</p></div><div><button id="add">新增采购价</button> <button id="imports" class="secondary">参考表导入预览</button></div></section><section class="panel"><div class="toolbar"><label>始发区域<input id="origin" placeholder="省、市或区域"></label><label>目的仓<input id="destination" placeholder="如西安、合肥"></label><label>运输段<select id="kind"><option value="">全部</option><option value="pickup">提货</option><option value="linehaul">干线</option></select></label><label>状态<select id="status"><option value="">全部</option><option value="confirmed">已确认</option><option value="draft">待确认</option></select></label></div><div class="table-wrap"><table><thead><tr><th>线路</th><th>供应商</th><th>采购价格</th><th>状态 / 有效期</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div><div class="pager"><button id="prev" class="secondary">上一页</button><span id="count"></span><button id="next" class="secondary">下一页</button></div></section></div></main><dialog id="editor"><form id="rate-form"><div class="dialog-heading"><h2>采购价录入</h2><button type="button" data-close="editor" class="secondary">关闭</button></div><div id="fields" class="fields"></div><details><summary>阶梯与备注</summary><p>阶梯按整票套档。填写体积、重量上下限及金额；两项条件同时匹配。</p><div id="tiers"></div><button type="button" id="add-tier" class="secondary">添加阶梯</button><label>包含项 / 备注<textarea name="notes" rows="3"></textarea></label></details><p id="error" role="alert"></p><footer><button id="save-rate">保存新版本</button></footer></form></dialog><dialog id="import-dialog"><div class="dialog-heading"><h2>参考表导入预览</h2><button data-close="import-dialog" class="secondary">关闭</button></div><p>原表427条已暂存为待确认资料。零价格、供应商及计价规则均须核实；轻货/重货卖价不作为采购成本。</p><div id="import-summary"></div><button id="show-drafts">查看待确认线路</button></dialog><script type="module" src="/src/domestic.js"></script><script type="module" src="/src/nav.js"></script></body></html>
