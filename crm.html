<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>客户资源 · 货代CRM</title><link rel="stylesheet" href="/src/style.css"><link rel="stylesheet" href="/src/crm.css"></head>
<body><header><div class="brand">E<span>货代客户与资源管理</span></div><a href="/">供应商管理</a><a href="/knowledge.html" class="pill">货代知识库</a><a href="/mail.html">邮件工作台</a></header><main>
<section id="login-panel" class="panel"><h2>登录客户系统</h2><form id="login-form"><label>邮箱<input id="login-email" type="email" autocomplete="username" required></label><label>密码<input id="login-password" type="password" autocomplete="current-password" required></label><p id="login-error" role="alert"></p><button type="submit">登录</button></form></section>
<p><span id="account"></span> <button id="logout" hidden>退出登录</button></p>
<div id="workspace" hidden><section class="heading"><div><p class="eyebrow">客户维护</p><h1>客户资源工作台</h1><p>查找公司、回顾线路、记录联系结果与下一步。</p></div><div class="actions"><button id="refresh" class="secondary">刷新</button><button id="add-company" disabled>新增公司</button></div></section>
<p id="notice" role="status" aria-live="polite"></p><section class="stats"><article>公司总数<strong id="total">0</strong></article><article>待核实<strong id="pending">0</strong></article><article>今日及逾期待跟进<strong id="due-count">0</strong></article></section>
<section class="panel"><div class="toolbar"><label>搜索<input id="search" type="search" placeholder="公司、邮箱、电话或线路"></label><label>客户状态<select id="status"><option value="">全部</option><option>待核实</option><option>潜在</option><option>正在跟进</option><option>合作中</option><option>沉睡</option><option>流失</option></select></label><label>跟进计划<select id="due"><option value="">全部</option><option value="due">今日及逾期</option></select></label><span id="count"></span></div>
<div class="table-wrap"><table><thead><tr><th>公司 / 角色</th><th>联系方式候选</th><th>线路</th><th>客户状态</th><th>下次联系</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div><p id="empty"></p><div class="pager"><button id="prev" class="secondary">上一页</button><span id="page"></span><button id="next" class="secondary">下一页</button></div></section>
<p class="footnote">历史线路来自旧运输记录，不代表当前需求。联系方式先核实，再标记有效。</p></div>
</main>
<dialog id="company-editor"><form id="company-form"><div class="dialog-heading"><h2 id="company-title">公司档案</h2><button type="button" data-close="company-editor" class="secondary">关闭</button></div><div class="fields">
<label class="wide">公司名称<input name="company_name" maxlength="240" required></label><label>客户状态<select name="status"><option>待核实</option><option>潜在</option><option>正在跟进</option><option>合作中</option><option>沉睡</option><option>流失</option></select></label><label>公司角色<select name="role"><option>待核实</option><option>直客</option><option>指定货发货人</option><option>同行</option><option>海外代理</option><option>客户兼供应商</option><option>其他</option></select></label><label>维护负责人<input name="owner" maxlength="80"></label><label>行业<input name="industry" maxlength="120"></label><label class="wide">当前需求线路<textarea name="current_routes" maxlength="1000"></textarea></label><label class="wide">地址（每行一个）<textarea name="addresses" rows="3"></textarea></label><label class="wide">备注<textarea name="notes" rows="3" maxlength="5000"></textarea></label></div><p id="company-error" role="alert"></p><footer><button type="submit">保存档案</button></footer></form></dialog>
<dialog id="detail" class="detail-dialog"><div class="dialog-heading"><h2 id="detail-title"></h2><button type="button" data-close="detail" class="secondary">关闭</button></div><p id="detail-note"></p><div class="actions"><button id="edit-company">编辑档案</button><button id="add-contact" class="secondary">新增联系人</button></div><h3>联系人与联系方式</h3><div id="contacts"></div><h3>跟进记录</h3><form id="followup-form"><label>本次沟通结果<textarea name="result" required maxlength="5000" rows="2"></textarea></label><label>下一步动作<input name="next_action" maxlength="1000"></label><label>下次联系日期<input name="next_date" type="date"></label><p id="followup-error" role="alert"></p><button type="submit">保存跟进</button></form><div id="followups"></div><h3>历史运输</h3><p>箱量保留原表cont_size的数值，拼箱记录不推定为整柜数量。</p><div class="table-wrap"><table><thead><tr><th>发车日期</th><th>起运地</th><th>目的地</th><th>箱型</th><th>原表数量</th></tr></thead><tbody id="history"></tbody></table></div><h3>来源与原始信息</h3><div id="sources"></div></dialog>
<dialog id="contact-editor"><form id="contact-form"><div class="dialog-heading"><h2>联系方式</h2><button type="button" data-close="contact-editor" class="secondary">关闭</button></div><div class="fields"><label>姓名<input name="name" maxlength="120" placeholder="不确定可留空"></label><label>渠道<select name="channel"><option>邮箱</option><option>电话</option><option>微信</option></select></label><label class="wide">联系方式<input name="value" required maxlength="500"></label><label>来源性质<input name="context" maxlength="500" placeholder="公司联系人、提货联系人等"></label><label>有效性<select name="status"><option>待核实</option><option>有效</option><option>失效</option></select></label></div><p id="contact-error" role="alert"></p><footer><button type="submit">保存联系方式</button></footer></form></dialog>
<script type="module" src="/src/crm.js"></script></body></html>
