name: Process map lead search queue
on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'
permissions:
  contents: read
concurrency:
  group: map-lead-queue-worker
  cancel-in-progress: false
jobs:
  ingest-map-leads:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install official Overture map client
        run: python -m pip install --disable-pip-version-check overturemaps
      - name: Check geographic tiling before download
        run: python -m unittest discover -s tests -p 'test_map_queue.py' -v && python -m unittest discover -s tests -p 'test_overture_download.py' -v
      - name: Claim one CRM map search and stage pending candidates
        env:
          OVERTURE_INGEST_SECRET: ${{ secrets.OVERTURE_INGEST_SECRET }}
        run: python -m scripts.run_map_search_queue
