name: Overture Hamburg lead extraction (manual)
run-name: Overture sample · ${{ inputs.city }} · max ${{ inputs.max_records }}
on:
  workflow_dispatch:
    inputs:
      city:
        description: City slug (Hamburg first)
        required: true
        type: choice
        options:
          - hamburg
      bbox:
        description: Hamburg bounding box west,south,east,north
        required: true
        type: string
        default: '9.75,53.40,10.33,53.72'
      max_records:
        description: Maximum number of candidates to export
        required: true
        type: choice
        options:
          - '100'
          - '500'
      auto_import:
        description: Import into Supabase staging automatically? Leave disabled for first test
        required: true
        type: boolean
        default: false
      task_id:
        description: Overture task UUID if auto_import is enabled
        required: false
        type: string
      release:
        description: Verified Overture data release if auto_import is enabled
        required: false
        type: string
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout pinned development extractor (not main app)
        uses: actions/checkout@v4
        with:
          ref: 315f5eaed988a8a5cad90626658d3cba15229d1d
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install official Overture command-line tool
        run: python -m pip install --disable-pip-version-check overturemaps
      - name: Test importer and download logic
        run: python -m unittest discover -s tests -p 'test_overture_*.py' -v
      - name: Download and select bounded Hamburg enterprises
        env:
          CITY: ${{ inputs.city }}
          BBOX: ${{ inputs.bbox }}
          MAX_RECORDS: ${{ inputs.max_records }}
        run: |
          python scripts/download_overture_candidates.py \
            --city "$CITY" --bbox "$BBOX" --max "$MAX_RECORDS" \
            --output-dir overture-output
      - name: Save sample for review for seven days
        uses: actions/upload-artifact@v4
        with:
          name: overture-hamburg-sample
          path: overture-output/
          retention-days: 7
          if-no-files-found: error
      - name: Optional candidate staging (never email)
        if: ${{ inputs.auto_import }}
        env:
          OVERTURE_INGEST_SECRET: ${{ secrets.OVERTURE_INGEST_SECRET }}
          TASK_ID: ${{ inputs.task_id }}
          RELEASE: ${{ inputs.release }}
          BBOX: ${{ inputs.bbox }}
          RUN_ID: ${{ github.run_id }}
          CITY: ${{ inputs.city }}
        run: |
          if [[ -z "$OVERTURE_INGEST_SECRET" || -z "$TASK_ID" || -z "$RELEASE" ]]; then
            echo "::error::Missing secret, task ID or verified release."
            exit 1
          fi
          python scripts/publish_overture_candidates.py \
            --file "overture-output/$CITY-freight-candidates.ndjson" \
            --task-id "$TASK_ID" --release "$RELEASE" --bbox "$BBOX" \
            --batch-key "overture-${RUN_ID}-first"
