<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eurasiago · 询价管理</title><style>body{font:14px system-ui,sans-serif;background:#f4f7fb;color:#18344b;margin:0}main{max-width:1150px;margin:36px auto;padding:0 18px}header,.panel{background:#fff;border:1px solid #dce5ef;border-radius:14px;padding:20px;margin-bottom:16px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:24px;margin:0}button,input,textarea{font:inherit;padding:10px;border:1px solid #b9c9d9;border-radius:7px}button{cursor:pointer;background:#eaf1f8}button.primary{background:#174f78;color:white}input{width:min(320px,90%)}textarea{width:100%;box-sizing:border-box;min-height:100px}table{width:100%;border-collapse:collapse}td,th{padding:12px;border-bottom:1px solid #e5ebf2;text-align:left}tr:hover{background:#f6f9fc}.muted{color:#657b8c}.error{color:#ad2b2b}.actions{display:flex;gap:10px;flex-wrap:wrap}.reply{padding:12px;border-bottom:1px solid #edf1f5;white-space:pre-wrap}a{color:#174f78}@media(max-width:650px){table{display:block;overflow-x:auto}header{display:block}}</style></head><body><main><header><div><h1>EURASIAGO · 询价管理</h1><p class="muted">客户询价 / Inquiry Center</p></div><div class="actions"><a href="/client.html">客户中心</a><a href="/crm.html">CRM</a><button id="logout" hidden>退出</button></div></header><div id="message" role="status"></div><section id="login" class="panel" hidden><h2>登录</h2><form id="login-form"><input name="email" type="email" placeholder="邮箱" required><input name="password" type="password" placeholder="密码" required><button class="primary">登录</button></form></section><section id="list" class="panel" hidden><div class="actions"><input id="search" placeholder="搜索编号、起运地、目的地"><button id="reload">刷新询价</button></div><p id="count" class="muted"></p><div style="overflow-x:auto"><table><thead><tr><th>询价编号</th><th>路线</th><th>类型</th><th>货物 / 重量 / 体积</th><th>提交时间</th><th>回复</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></section><section id="detail" class="panel" hidden><button id="back">← 返回询价</button><h2 id="detail-title"></h2><p id="detail-cargo"></p><div id="replies"></div><form id="reply-form"><h3>回复询价</h3><textarea id="reply-body" maxlength="10000" required placeholder="填写回复或报价信息"></textarea><button class="primary">发送回复</button></form><p id="reply-note" class="muted"></p></section></main><script type="module" src="/src/inquiry-center.js"></script></body></html>
