<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eurasiago · 询价管理</title><link rel="stylesheet" href="/src/inquiry-center.css"></head><body><main><header><div><h1>EURASIAGO · 询价管理</h1><p class="muted">客户询价 / Inquiry Center</p></div><div class="actions"><a href="/client.html">客户中心</a><a href="/crm.html">CRM</a><button id="logout" hidden>退出</button></div></header><div id="message" role="status"></div><section id="login" class="panel" hidden><h2>登录</h2><form id="login-form"><input name="email" type="email" placeholder="邮箱" required><input name="password" type="password" placeholder="密码" required><button class="primary">登录</button></form></section><section id="list" class="panel" hidden><div class="actions"><input id="search" placeholder="搜索编号、起运地、目的地"><button id="reload">刷新询价</button></div><p id="count" class="muted"></p><div style="overflow-x:auto"><table><thead><tr><th>询价编号</th><th>路线</th><th>类型</th><th>货物 / 重量 / 体积</th><th>提交时间</th><th>回复</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></section><section id="detail" class="panel" hidden><button id="back">← 返回询价</button><h2 id="detail-title"></h2><p id="detail-cargo"></p><div id="link-panel" hidden><h3>关联客户企业（管理员审核）</h3><p class="muted">请先核对询价公司及联系人，确认归属后关联。此操作将允许该企业的客户查看此询价。</p><select id="link-company"></select> <button id="link-confirm" type="button">确认关联</button></div><div id="replies"></div><form id="reply-form"><h3>回复询价</h3><textarea id="reply-body" maxlength="10000" required placeholder="填写回复或报价信息"></textarea><button class="primary">发送回复</button></form><p id="reply-note" class="muted"></p></section></main><script type="module" src="/src/inquiry-center.js"></script></body></html>
