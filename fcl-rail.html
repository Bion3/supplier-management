<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>整箱铁路运费</title><link rel="stylesheet" href="/src/style.css"><link rel="stylesheet" href="/src/crm.css"><link rel="stylesheet" href="/src/cost.css"><link rel="stylesheet" href="/src/hub.css"><link rel="stylesheet" href="/src/price-table-ui.css"></head><body><header></header><main><section id="login-panel" class="panel"><h2>登录整箱铁路运费</h2><form id="login-form"><label>邮箱<input name="email" type="email" required autocomplete="username"></label><label>密码<input name="password" type="password" required autocomplete="current-password"></label><button>登录</button></form></section><p id="notice" role="status"></p><div id="workspace" hidden><nav class="price-module-tabs" aria-label="价格模块"><a href="/fcl-rail.html" aria-current="page">整柜铁路运费</a><a href="/rates.html">拼箱干线</a><a href="/rail-rates.html">拼箱铁路运费</a><a href="/trucking.html">整柜拖车费</a><a href="/container-rental.html">整柜租箱费</a></nav><section class="heading"><div><h1>整箱铁路运费</h1><p>按供应商、箱型与计价范围维护采购价；参考价和未核对项目保留为待确认。</p></div><div><button id="add">新增运费</button> <button id="confirm-selected" class="secondary" disabled>批量确认</button> <button id="disable-selected" class="secondary" disabled>批量停用</button></div></section><section class="panel"><div class="toolbar fcl-toolbar"><label>搜索<input id="search" type="search" placeholder="站点、途经口岸、班列类型、来源"></label><label>供应商<select id="supplier-filter"><option value="">全部</option></select></label><label>箱型<select id="box-filter"><option value="">全部</option></select></label><label>用箱<select id="equipment-filter"><option value="">全部</option><option>SOC</option><option>COC</option><option>待确认</option></select></label><label>计价范围<select id="scope-filter"><option value="">全部</option></select></label><label>币种<select id="currency-filter"><option value="">全部</option><option>USD</option><option>CNY</option><option value="unknown">待确认</option></select></label><label>状态<select id="status-filter"><option value="">使用中</option><option value="draft">待确认</option><option value="confirmed">启用</option><option value="inactive">停用</option><option value="all">全部</option></select></label></div><p id="selection-info"></p><div class="table-wrap"><table class="data-columns"><thead><tr><th class="select-col"><input id="select-page" type="checkbox" aria-label="选择当前页"></th><th>起运站</th><th>目的站</th><th>供应商</th><th>班列 / 口岸</th><th>箱型</th><th>用箱</th><th>运价</th><th>计价范围</th><th>有效期</th><th>状态</th><th>操作</th></tr></thead><tbody id="fcl-rows"></tbody></table></div></section></div></main><dialog id="editor" class="supplier-quote-dialog"><form id="quote-form"><div class="dialog-heading"><h2>整箱铁路运费维护</h2><button type="button" id="close" class="secondary">关闭</button></div><div id="fields" class="fields"></div><details open><summary>单项附加费</summary><p>仅记录另计项目，留空金额表示待确认；包含费用写入说明。</p><div id="fee-items"></div><button type="button" id="add-fee" class="secondary">添加费用</button></details><details><summary>利润预设（预留）</summary><p>采购价保持原供应商成本；利润预设供后续报价功能使用。</p><div class="fields"><label>方式<select name="profitMode"><option value="markup">成本加成 %</option><option value="margin">销售毛利率 %</option><option value="fixed">固定利润 USD</option></select></label><label>数值<input name="profitValue" type="number" min="0" step="any" value="0"></label></div></details><label>费用包含、限制及待确认说明<textarea name="notes" rows="5"></textarea></label><details><summary>原始报价来源</summary><p id="source" style="white-space:pre-wrap"></p></details><p id="error" role="alert"></p><footer><button id="save">保存新版本</button></footer></form></dialog><script type="module" src="/src/fcl-rail.js"></script><script type="module" src="/src/nav.js"></script></body></html>
