<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>基础信息</title><link rel="stylesheet" href="/src/style.css"><link rel="stylesheet" href="/src/hub.css"><link rel="stylesheet" href="/src/master-data.css"></head>
<body><header></header><main>
<section id="login-panel" class="panel"><h2>登录</h2><form id="login-form"><label>邮箱<input name="email" type="email" required autocomplete="username"></label><label>密码<input name="password" type="password" required autocomplete="current-password"></label><button>登录</button></form></section>
<div id="workspace" hidden><section class="master-heading"><div><p class="eyebrow">MASTER DATA</p><h1>基础信息</h1><p>统一维护起运地、目的地和费用名称，供成本录入选择。</p></div><button id="add-master">新增档案</button></section>
<nav class="master-tabs" aria-label="档案类型"><button type="button" data-kind="location" aria-pressed="true">地点档案</button><button type="button" data-kind="charge" aria-pressed="false">费用项目</button></nav>
<section class="panel"><div class="master-filters"><label>搜索<input id="master-search" type="search" placeholder="名称、英文、编号、国家、城市"></label><label>分类<select id="master-category"></select></label><label id="role-filter-label">用途<select id="master-role"><option value="">全部</option><option value="origin">起运地</option><option value="destination">目的地</option><option value="transit">中转地</option></select></label><label>状态<select id="master-status"><option value="active">启用</option><option value="all">全部</option><option value="inactive">停用</option></select></label><button id="refresh-master" class="secondary">刷新</button></div>
<p id="notice" role="status"></p><div class="table-wrap"><table><thead id="master-head"></thead><tbody id="master-rows"></tbody></table></div></section></div>
<dialog id="master-editor"><form id="master-form"><div class="master-dialog-top"><h2 id="editor-title">新增档案</h2><div><button type="button" id="close-master" class="secondary">取消</button> <button id="save-master">保存</button></div></div><div class="master-fields">
<label>内部编号<input name="code" required maxlength="40" placeholder="例如 CN-WUHAN"></label><label>中文名称<input name="name_zh" required maxlength="120"></label><label>英文名称<input name="name_en" maxlength="160"></label><label>分类<select name="category"></select></label>
<label data-location-field>国家<input name="country" list="master-countries"></label><label data-location-field>所属城市<input name="city" maxlength="120"></label><fieldset data-location-field><legend>适用位置</legend><label><input type="checkbox" name="roles" value="origin">起运地</label><label><input type="checkbox" name="roles" value="destination">目的地</label><label><input type="checkbox" name="roles" value="transit">中转地</label></fieldset>
<label data-charge-field>常用计价单位<input name="unit" list="master-units" maxlength="40"></label><label>状态<select name="enabled"><option value="true">启用</option><option value="false">停用</option></select></label><label class="full">别名<textarea name="aliases" rows="2" placeholder="多个别名用逗号或换行分隔"></textarea></label><label class="full">备注<textarea name="notes" rows="3"></textarea></label></div><p id="master-error" role="alert"></p><p class="master-help">内部编号保存后固定；停用后不再提供给新录入选择，历史报价保留原文。费用项目只维护名称和单位，具体金额在采购价格中维护。</p></form></dialog>
<datalist id="master-countries"></datalist><datalist id="master-units"><option value="柜"><option value="票"><option value="车"><option value="CBM"><option value="kg"><option value="吨"><option value="天"><option value="件"></datalist>
</main><script type="module" src="/src/master-data.js"></script><script type="module" src="/src/nav.js"></script></body></html>
